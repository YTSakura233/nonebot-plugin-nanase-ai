[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nonebot-plugin-soruto-ai"
version = "0.1.3"
description = "ナナセ AI personality, memory and tools for NoneBot2 / OneBot V11"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
  "nonebot2>=2.4,<3", "nonebot-adapter-onebot>=2.4,<3",
  "pydantic>=2.7,<3", "aiomysql>=0.2,<1", "httpx>=0.27.2,<1",
  "PyYAML>=6,<7", "jsonschema>=4.20,<5",
]
[project.urls]
Repository = "https://github.com/YTSakura233/nonebot-plugin-nanase-ai"
[project.optional-dependencies]
mcp = ["mcp>=2.3,<3", "sse-starlette>=3.0,<3.1"]
documents = ["pypdf>=5", "python-docx>=1.1"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "build>=1", "wheel>=0.45"]
[tool.setuptools.packages.find]
where = ["."]
include = ["nonebot_plugin_soruto_ai*"]
[tool.setuptools.package-data]
nonebot_plugin_soruto_ai = ["system_prompt.md", "ngwords.txt"]
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
